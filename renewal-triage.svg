<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#0b1020"/>
  <text x="70" y="92" fill="#f8fafc" font-family="Arial,sans-serif" font-size="48" font-weight="700">SaaS renewal triage</text>
  <text x="70" y="140" fill="#94a3b8" font-family="Arial,sans-serif" font-size="25">Rank the renewals worth investigating before notice dates close.</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="195" width="310" height="115" rx="14" fill="#18233b" stroke="#334155"/>
    <text x="95" y="238" fill="#38bdf8" font-size="22" font-weight="700">1. Inventory</text>
    <text x="95" y="276" fill="#e2e8f0" font-size="21">Owner · renewal · notice</text>
    <rect x="445" y="195" width="310" height="115" rx="14" fill="#18233b" stroke="#334155"/>
    <text x="470" y="238" fill="#fbbf24" font-size="22" font-weight="700">2. Evidence</text>
    <text x="470" y="276" fill="#e2e8f0" font-size="21">Spend · usage · overlap</text>
    <rect x="820" y="195" width="310" height="115" rx="14" fill="#18233b" stroke="#334155"/>
    <text x="845" y="238" fill="#4ade80" font-size="22" font-weight="700">3. Decide</text>
    <text x="845" y="276" fill="#e2e8f0" font-size="21">Keep · review · exit</text>
    <path d="M382 252 H430" stroke="#64748b" stroke-width="5"/><path d="M757 252 H805" stroke="#64748b" stroke-width="5"/>
    <rect x="70" y="370" width="1060" height="170" rx="16" fill="#111827" stroke="#334155"/>
    <text x="100" y="420" fill="#f8fafc" font-size="25" font-weight="700">Priority score (0–13)</text>
    <text x="100" y="464" fill="#cbd5e1" font-size="22">Renewal urgency 0–3  +  spend exposure 0–3  +  utilization gap 0–3</text>
    <text x="100" y="502" fill="#cbd5e1" font-size="22">+ overlap 0–2  +  exit complexity 0–2</text>
    <text x="70" y="605" fill="#94a3b8" font-size="19">Free template · synthetic example only · no savings claims</text>
  </g>
</svg>
